# Untrusted PR CI (separate from signing/promotion per 08_Repo_Structure.md).
name: ci
on:
  push:
  pull_request:

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-validation.txt
      # Runs first so a seal that merely lags a docs/code commit fails with
      # "regenerate (python3 tools/validate_dossier.py --write)" instead of
      # the validator's opaque "Package manifest differs".
      - name: Dossier seal freshness
        run: python3 tools/check_dossier_seal.py
      - name: Package structural validation
        run: python3 tools/validate_dossier.py
      - name: Contract tests
        run: python3 tools/test_contracts.py
      - name: Semantic color contrast audit
        run: python3 tools/check_contrast.py
      - name: Generate SBOM (CycloneDX)
        run: python3 tools/generate_sbom.py --write
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: evidence/sbom.cyclonedx.json
      - name: Engine pin freshness
        run: |
          cargo fetch --manifest-path core/Cargo.toml
          python3 tools/pin_engine.py --check
      - name: llama.cpp vendor pin (third_party/llama.cpp vs HARBOR_PIN.json)
        run: python3 -I tools/vendor_llama_cpp.py --check

  supply-chain:
    # Dependency hygiene for the core workspace: RustSec advisories
    # (cargo audit), and license / ban / source policy (cargo deny) as
    # encoded in core/deny.toml. Accepted advisories live in deny.toml
    # with a reason; core/.cargo/audit.toml must mirror them.
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Accepted-advisory lists agree (deny.toml == audit.toml)
        run: python3 ../tools/check_advisory_ignores.py
      - name: RustSec advisories (cargo audit)
        run: cargo audit
      - name: License, ban and source policy (cargo deny)
        run: cargo deny check

  fuzz:
    # Short libFuzzer runs of the boundary and the validators below the
    # model (production plan C4). The long runs and the committed corpus
    # come from the qualification machine (tools/fuzz.sh); CI proves the
    # targets still build and survive a minute each on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz (60 s per target, no sanitizer)
        run: tools/fuzz.sh 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: core/fuzz/artifacts
          if-no-files-found: ignore

  rust:
    runs-on: macos-14
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Formatting gate
        run: cargo fmt --check
      - name: Clippy gate (all targets, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test all crates (offline)
        run: cargo test --workspace
      # The inference worker tests drive the real launcher and core library
      # (decision 0022 phase 3). `cargo test --workspace` rebuilds harbor_ffi
      # as a test harness, so build the cdylib + launcher after it and run
      # the worker tests on their own.
      - name: Inference worker (real launcher + core library)
        run: |
          cargo build -p harbor_ffi -p harbor_worker
          cargo test -p harbor_ffi --test inference_worker
      # The real-network tier (#[ignore] tests: real HF acquisition,
      # network-capture qualification) is a QUALIFICATION-MACHINE
      # activity — HF's edge resets/throttles shared runner IPs, so
      # runner runs are not meaningful evidence. It passes and is
      # recorded on the qualification machine
      # (evidence/network_capture.json, commit-bound); see
      # docs/STATUS.md "Reproduce the evidence".
      - name: Formula qualification report
        run: cargo test -p harbor_formula full_qualification -- --nocapture

  numerics:
    # Decision 0022 phase 5: the production embedder's numerics canary on
    # the runner's GPU (Metal) and on the true CPU path, plus the media
    # retrieval test. Fixtures come from Hugging Face at pinned revisions,
    # checked by sha256 and cached; a throttled download fails the job
    # loudly (HARBOR_REQUIRE_FIXTURES=1) rather than skipping.
    runs-on: macos-14
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/cache@v4
        with:
          path: fixtures/models
          key: numerics-fixtures-embeddinggemma2-bfcd2987-stories260k
      - name: Fetch pinned fixtures
        run: python3 -I ../tools/fetch_numerics_fixtures.py ../fixtures/models
      - name: Canary on the default backend (Metal) and the CPU path
        env: { HARBOR_REQUIRE_FIXTURES: "1" }
        run: cargo test -p harbor_inference --features multimodal --test numerics_canary --test multimodal_live -- --nocapture
      - name: Same tests with the GPU switched off
        env: { HARBOR_REQUIRE_FIXTURES: "1", HARBOR_GGUF_CPU_ONLY: "1" }
        run: cargo test -p harbor_inference --features multimodal --test numerics_canary --test multimodal_live -- --nocapture

  lean-core:
    # The Office-only core (no llama.cpp) is what harbor_office ships. It
    # silently stopped compiling once because nothing built it.
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Check the lean harbor_ffi build
        run: cargo check -p harbor_ffi --no-default-features

  windows-core:
    # Compile-gates the Windows-specific core paths (DPAPI keystore
    # adapter, harbor_ffi cdylib) that cannot be built on the macOS
    # machine. Runtime qualification stays on a real Windows machine
    # (WIN-01, external).
    runs-on: windows-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Check workspace for the Windows target
        run: cargo check --workspace --all-targets
      - name: Clippy gate (Windows paths)
        run: cargo clippy --workspace --all-targets -- -D warnings

  flutter:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Build the native core for the live FFI tests
        run: cargo build --manifest-path core/Cargo.toml -p harbor_ffi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Pub get (packages + app)
        run: |
          for d in packages/harbor_domain packages/harbor_native packages/harbor_ui apps/harbor_app; do
            (cd "$d" && flutter pub get)
          done
      - name: Dependency freshness report (non-blocking)
        continue-on-error: true
        run: |
          for d in packages/harbor_domain packages/harbor_native packages/harbor_ui apps/harbor_app; do
            echo "== $d"; (cd "$d" && flutter pub outdated --no-dev-dependencies || true)
          done
      - name: Dart formatting gate
        run: |
          for d in packages/harbor_domain packages/harbor_native packages/harbor_ui apps/harbor_app; do
            (cd "$d" && dart format --output=none --set-exit-if-changed lib test)
          done
      - name: Analyze gate
        run: |
          for d in packages/harbor_domain packages/harbor_native packages/harbor_ui apps/harbor_app; do
            (cd "$d" && flutter analyze --no-pub)
          done
      - name: Package tests
        run: |
          for d in packages/harbor_domain packages/harbor_native packages/harbor_ui; do
            (cd "$d" && flutter test)
          done
      - name: App tests (live core, shell + a11y + l10n + RAG journey)
        run: (cd apps/harbor_app && flutter test)
