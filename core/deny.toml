# cargo-deny policy for the Harbor core workspace (CI: `cargo deny check`).
#
# Encodes the notices policy recorded in docs/release/THIRD_PARTY_NOTICES.md:
# every third-party crate must carry a permissive license from the allow list
# below; anything else (copyleft, unknown, unlicensed) fails the gate and needs
# a decision here before it can ship. Advisories are errors unless listed in
# `ignore` with a reason and an owner-visible re-check trigger.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
]
all-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec database). `cargo audit` runs beside this in CI; the
# ignore list is the single place where an accepted advisory is recorded.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # quick-xml < 0.41 DoS advisories (unbounded namespace allocation,
  # quadratic duplicate-attribute check). Reached only through
  # formualizer-workbook 0.9.3 (quick-xml 0.39) and its umya-spreadsheet
  # 2.3.2 (quick-xml 0.37) loader; Harbor's own XML path is umya 3.1 /
  # quick-xml 0.41 (patched). Impact is availability only (hang or
  # allocation failure) on a workbook the user chose to open locally; no
  # confidentiality or integrity effect and no network reachability.
  # Re-check: formualizer > 0.9.3 (upstream bump to umya 3 / quick-xml 0.41).
  { id = "RUSTSEC-2026-0194", reason = "availability-only, local-file input, upstream formualizer 0.9.3 pin; re-check on formualizer release" },
  { id = "RUSTSEC-2026-0195", reason = "availability-only, local-file input, upstream formualizer 0.9.3 pin; re-check on formualizer release" },
  # ttf-parser is unmaintained; reached through lopdf 0.42 via pdf-extract
  # 0.12.1 (latest). Used only to read glyph tables while extracting text
  # from a user-chosen PDF. Re-check when pdf-extract or lopdf drops it.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained notice via pdf-extract 0.12.1 (latest); text-extraction path only" },
]

# ---------------------------------------------------------------------------
# Licenses. Version 2 semantics: anything not in `allow` is denied.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

# ---------------------------------------------------------------------------
# Bans: duplicate crate versions are reported (not failed) because the
# formualizer / umya pin legitimately doubles a few crates today; wildcard
# and git dependencies are denied so the lockfile stays reproducible.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members reference each other by path without a version; that is
# the intended shape for private crates, not an unpinned dependency.
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
  # Harbor is local-only; no crate may open a telemetry or analytics channel.
  { crate = "sentry", reason = "no telemetry (privacy contract)" },
  { crate = "openssl", reason = "TLS is rustls only (reproducible, no system OpenSSL)" },
  { crate = "openssl-sys", reason = "TLS is rustls only" },
  { crate = "native-tls", reason = "TLS is rustls only" },
]

# ---------------------------------------------------------------------------
# Sources: crates.io only.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
