[package]
name = "harbor_llama_sys"
version = "0.8.0"
edition = "2021"
links = "llama"
build = "build.rs"
description = "Raw FFI bindings to the pinned llama.cpp in third_party/llama.cpp (decision 0022)"
# Derived from llama-cpp-sys-2 0.1.156 (MIT OR Apache-2.0); see NOTICE.
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "harbor_llama_sys"
path = "src/lib.rs"

[features]
# JSON Schema -> GBNF (structured output) from llama.cpp common/.
common = []
# Multimodal (mtmd) library: image / audio projectors.
mtmd = []
# Metal is enabled by ggml's CMake defaults on Apple targets; the feature is
# kept so callers can state it explicitly.
metal = []
vulkan = []
openmp = []
static-openmp = ["openmp"]
# Android C++ runtime selection.
shared-stdcxx = []
static-stdcxx = []

[build-dependencies]
bindgen = "0.72.1"
cc = { version = "1.2.61", features = ["parallel"] }
cmake = "0.1"
glob = "0.3.3"
