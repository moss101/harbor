[package]
name = "harbor_render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
harbor_artifacts = { workspace = true }
harbor_canonical = { workspace = true }
harbor_formula = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pdf-extract = "0.12"
# Same version pdf-extract already resolves to: page images are read straight
# out of the PDF objects (no renderer), so a scan can reach any OCR engine.
lopdf = { version = "=0.42.0", default-features = false }
flate2 = "1"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
