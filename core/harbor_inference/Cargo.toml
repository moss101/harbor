[package]
name = "harbor_inference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
harbor_canonical = { workspace = true }
harbor_modelhub = { workspace = true }
harbor_security = { workspace = true }
harbor_net = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Harbor-owned llama.cpp bindings (decision 0022, phase 4): harbor_llama over
# harbor_llama_sys, built from the pinned tree in third_party/llama.cpp
# (HARBOR_PIN.json). Imported under the dependency name `llama-cpp-2` so the
# `llama_cpp_2::` paths in this crate are unchanged.
llama-cpp-2 = { package = "harbor_llama", path = "../harbor_llama", optional = true }
encoding_rs = { version = "0.8", optional = true }

[features]
gguf-backend = ["dep:llama-cpp-2", "dep:encoding_rs"]
# Image / audio embedding through the mmproj projector (decision 0015).
multimodal = ["gguf-backend", "llama-cpp-2/mtmd"]
# Vulkan GPU backend (Android; desktop where the Vulkan SDK exists). The
# runtime falls back to CPU when the device exposes no usable Vulkan GPU, and
# the embedding numerics canary rejects a GPU path that embeds wrongly.
vulkan = ["gguf-backend", "llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile = "3"
harbor_modelhub = { workspace = true }
