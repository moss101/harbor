[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "harbor_canonical",
    "harbor_store",
    "harbor_sync",
    "harbor_security",
    "harbor_net",
    "harbor_agent",
    "harbor_formula",
    "harbor_artifacts",
    "harbor_knowledge",
    "harbor_modelhub",
    "harbor_llama_sys",
    "harbor_llama",
    "harbor_inference",
    "harbor_render",
    "harbor_core",
    "harbor_ffi",
    "harbor_worker",
    "harbor_integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/mohsin/harbor"

[workspace.dependencies]
harbor_canonical = { path = "harbor_canonical" }
harbor_store = { path = "harbor_store" }
harbor_security = { path = "harbor_security" }
harbor_net = { path = "harbor_net" }
harbor_agent = { path = "harbor_agent" }
harbor_formula = { path = "harbor_formula" }
harbor_artifacts = { path = "harbor_artifacts" }
harbor_knowledge = { path = "harbor_knowledge" }
harbor_modelhub = { path = "harbor_modelhub" }
harbor_inference = { path = "harbor_inference" }
harbor_render = { path = "harbor_render" }
harbor_core = { path = "harbor_core" }
harbor_ffi = { path = "harbor_ffi" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Default features off: the default `xlsx-recalc` pulls in calamine, which
# Harbor never calls (RUSTSEC-2026-0436; decision 0001 addendum 4).
# `system-clock` (a default) is enabled on formualizer-eval directly: going
# through formualizer's weak `formualizer-sheetport?/system-clock` would keep
# sheetport-spec/serde_yaml in Cargo.lock even though nothing builds it.
formualizer = { version = "0.9", default-features = false, features = ["eval", "workbook", "parse", "common", "umya"] }
formualizer-eval = { version = "0.9", features = ["system-clock"] }
umya-spreadsheet = "3.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
regex = "1"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# HARBOR PATCH (decision 0001 addendum): formualizer-eval 0.9.3 with the
# TEXT percent deviation fixed (txt-text-2). Everything else is the exact
# crates.io source (plus arrow 59 -> 60 for RUSTSEC-2026-0442, addendum 4);
# the patched tree is pinned by tools/pin_engine.py.
[patch.crates-io]
formualizer-eval = { path = "../third_party/formualizer-eval" }
