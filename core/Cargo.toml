[workspace]
resolver = "2"
members = [
    "harbor_canonical",
    "harbor_store",
    "harbor_security",
    "harbor_net",
    "harbor_agent",
    "harbor_formula",
    "harbor_artifacts",
    "harbor_knowledge",
    "harbor_modelhub",
    "harbor_inference",
    "harbor_render",
    "harbor_core",
    "harbor_ffi",
    "harbor_integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mohsin/harbor"

[workspace.dependencies]
harbor_canonical = { path = "harbor_canonical" }
harbor_store = { path = "harbor_store" }
harbor_security = { path = "harbor_security" }
harbor_net = { path = "harbor_net" }
harbor_agent = { path = "harbor_agent" }
harbor_formula = { path = "harbor_formula" }
harbor_artifacts = { path = "harbor_artifacts" }
harbor_knowledge = { path = "harbor_knowledge" }
harbor_modelhub = { path = "harbor_modelhub" }
harbor_inference = { path = "harbor_inference" }
harbor_render = { path = "harbor_render" }
harbor_core = { path = "harbor_core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
formualizer = { version = "0.9", features = ["umya"] }
umya-spreadsheet = "3.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
roxmltree = "0.21"
regex = "1"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
