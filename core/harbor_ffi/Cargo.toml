[package]
name = "harbor_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "harbor_ffi"
# rlib lets integration tests drive the real persistence layer directly;
# cdylib is the app-facing dylib, staticlib the iOS device archive.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
harbor_core = { workspace = true }
harbor_agent = { workspace = true }
harbor_artifacts = { workspace = true }
harbor_canonical = { workspace = true }
harbor_formula = { workspace = true }
harbor_modelhub = { workspace = true }
harbor_render = { workspace = true }
harbor_knowledge = { workspace = true }
harbor_inference = { workspace = true, features = ["gguf-backend"] }
harbor_net = { workspace = true }
harbor_security = { workspace = true }
harbor_store = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
zip = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
