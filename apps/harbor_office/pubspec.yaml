name: harbor_office
description: "Harbor Office Suite — the standalone office apps: documents, workbooks, decks and PDF."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.0
  harbor_ui:
    path: ../../packages/harbor_ui
  harbor_native:
    path: ../../packages/harbor_native
  harbor_domain:
    path: ../../packages/harbor_domain
  path_provider: ^2.1.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # The signed model catalog (harbor.catalog/v1) and its pinned root key,

flutter_launcher_icons:
  image_path: icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#1F5FCC"
  adaptive_icon_foreground: icon.png
