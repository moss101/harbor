name: harbor_app
description: "Harbor — your AI. Your models. Your device. Your work."
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  harbor_ui:
    path: ../../packages/harbor_ui
  harbor_native:
    path: ../../packages/harbor_native
  harbor_domain:
    path: ../../packages/harbor_domain
  path_provider: ^2.1.0
  file_selector: ^1.0.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  # The signed model catalog (harbor.catalog/v1) and its pinned root key,
  # copied verbatim from fixtures/catalog (test/catalog_assets_test.dart
  # keeps them identical). Imported into the core on first run so
  # Models → Recommended works offline.
  assets:
    - assets/catalog/signed_catalog.json
    - assets/catalog/root_public.hex
    # Settings → Privacy Policy; also the source of the public page
    # (tools/build_privacy_site.py).
    - assets/privacy/privacy_policy.md
